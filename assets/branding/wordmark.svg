<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <defs>
    <linearGradient id="wordmark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="wordmark-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Stylized Icon Mark on Left -->
  <g transform="translate(15, 15) scale(0.14)">
    <rect x="0" y="0" width="500" height="500" rx="120" fill="#0f172a" stroke="rgba(255,255,255,0.15)" stroke-width="8" />
    <ellipse cx="250" cy="250" rx="200" ry="85" transform="rotate(-28 250 250)" fill="none" stroke="#38bdf8" stroke-width="20" stroke-dasharray="180 40 80 40" />
    <path d="M120 370 L120 160 L250 250 L250 370 Z" fill="#3b82f6" />
    <path d="M380 370 L380 160 L250 250 L250 370 Z" fill="#8b5cf6" />
    <circle cx="250" cy="250" r="22" fill="#38bdf8" />
  </g>

  <!-- Typography "MyOS" -->
  <text x="110" y="68" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Inter, sans-serif" font-size="54" font-weight="800" letter-spacing="-1.5" fill="#f8fafc">
    My<tspan fill="url(#wordmark-grad)" filter="url(#wordmark-glow)">OS</tspan>
  </text>
  
  <!-- Subtitle Tag -->
  <text x="236" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#38bdf8" opacity="0.9">
    PLATFORM
  </text>
</svg>
