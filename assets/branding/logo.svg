<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="myos-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#4267d5" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="myos-grad-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="myos-grad-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2" />
    </linearGradient>
    <filter id="myos-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="myos-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="256" cy="256" r="210" fill="url(#myos-grad-primary)" opacity="0.12" filter="blur(32px)" />

  <!-- Base Rounded Squircle Container -->
  <rect x="48" y="48" width="416" height="416" rx="108" fill="#0b0f19" filter="url(#myos-shadow)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />
  
  <!-- Subtle Internal Grid / Glass Shimmer -->
  <rect x="52" y="52" width="408" height="408" rx="104" fill="none" stroke="url(#myos-grad-glow)" stroke-width="1.5" opacity="0.6" />

  <!-- Core MyOS Interlocking "M" & Orbital Ring -->
  <g transform="translate(116, 126)">
    <!-- Dynamic Orbit Ring -->
    <ellipse cx="140" cy="130" rx="136" ry="60" transform="rotate(-28 140 130)" fill="none" stroke="url(#myos-grad-accent)" stroke-width="14" stroke-dasharray="140 30 70 30" opacity="0.85" filter="url(#myos-glow)" />

    <!-- Left Pillar of M -->
    <path d="M40 210 L40 70 C40 54 58 44 72 52 L140 98 L140 210 C140 220 128 226 120 220 L48 170 C43 166 40 160 40 154 Z" fill="url(#myos-grad-primary)" filter="url(#myos-shadow)" />

    <!-- Right Pillar of M -->
    <path d="M240 210 L240 70 C240 54 222 44 208 52 L140 98 L140 210 C140 220 152 226 160 220 L232 170 C237 166 240 160 240 154 Z" fill="url(#myos-grad-primary)" opacity="0.95" />

    <!-- Central Diamond Apex Vertex -->
    <path d="M140 50 L190 85 L140 120 L90 85 Z" fill="url(#myos-grad-accent)" filter="url(#myos-glow)" />

    <!-- Core Floating Nucleus Pulse -->
    <circle cx="140" cy="155" r="14" fill="#38bdf8" filter="url(#myos-glow)" />
    <circle cx="140" cy="155" r="6" fill="#ffffff" />
  </g>
</svg>
