<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Antigravity OS / Workframe Icon Mark -->
  <!-- Flat-vector precision with two-tier depth layer: Deep Terracotta (#E06C38), Cool White (#ECEFF4), Subtle Steel (#2D333F) -->
  <defs>
    <!-- Crisp subtle 2-tier depth shadow -->
    <filter id="tier-depth" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Desktop Surface Canvas Tile -->
  <rect x="32" y="32" width="448" height="448" rx="56" fill="#14171D" stroke="#2D333F" stroke-width="2" />

  <!-- Active Window Frame (Deep Terracotta #E06C38) -->
  <rect x="56" y="56" width="400" height="400" rx="44" fill="#1E222A" stroke="#E06C38" stroke-width="8" />

  <!-- Window Header Titlebar Divider -->
  <line x1="56" y1="120" x2="456" y2="120" stroke="#2D333F" stroke-width="2" />
  <!-- Window Header Decorative Tiles (Subtle Steel & Terracotta) -->
  <circle cx="96" cy="88" r="7" fill="#E06C38" />
  <circle cx="124" cy="88" r="7" fill="#2D333F" />
  <circle cx="152" cy="88" r="7" fill="#2D333F" />

  <!-- Interlocking Geometric L-Shapes (Tiling Window Management & Stylized "A") -->
  <!-- Tier 1: Right/Bottom Interlocking L-Pane (Subtle Steel #2D333F with Terracotta Accent) -->
  <g filter="url(#tier-depth)">
    <!-- Right vertical and bottom horizontal interlocking L-shape -->
    <path d="M 232 208
             L 368 208
             L 368 400
             L 288 400
             L 288 288
             L 232 288
             Z"
          fill="#2D333F"
          stroke="#1E222A"
          stroke-width="3" />
    <!-- Horizontal Cross-bar locking tile (Deep Terracotta #E06C38) -->
    <rect x="200" y="304" width="136" height="48" rx="8" fill="#E06C38" />
  </g>

  <!-- Tier 2: Left/Top Interlocking L-Pane (Cool White #ECEFF4) -->
  <!-- Forms the primary chevron peak and left vertical pillar of the "A" -->
  <g filter="url(#tier-depth)">
    <path d="M 144 400
             L 144 208
             L 256 152
             L 256 224
             L 216 244
             L 216 400
             Z"
          fill="#ECEFF4"
          stroke="#1E222A"
          stroke-width="3" />
  </g>

  <!-- Center Negative-Space Triangle Core (Window Split-Pane Apex) -->
  <polygon points="256,220 224,284 288,284" fill="#1E222A" />
</svg>
